[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "itransformer-repro"
version = "0.1.0"
description = "Course reproduction of iTransformer (ICLR 2024) for long-term multivariate forecasting"
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "PyYAML>=6.0",
    "matplotlib>=3.7",
    "torch>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
]

[project.scripts]
itransformer-repro = "itransformer_repro.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/itransformer_repro"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["itransformer_repro"]
branch = true
