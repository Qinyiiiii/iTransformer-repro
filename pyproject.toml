[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "itransformer-repro"
version = "0.1.0"
description = "Course reproduction of iTransformer (ICLR 2024) for long-term multivariate forecasting"
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = { text = "MIT" }
# 运行时与开发依赖统一声明在根目录 requirements.txt（含 -e . 安装本包）。

[project.scripts]
itransformer-repro = "itransformer_repro.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/itransformer_repro"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["itransformer_repro"]
branch = true

[tool.coverage.report]
fail_under = 80
